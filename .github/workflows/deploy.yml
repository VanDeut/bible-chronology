name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Hosted at <user>.github.io/<repo>/ — sets basePath/assetPrefix in next.config.ts.
          # Remove GITHUB_PAGES to serve from a custom domain at the site root instead.
          GITHUB_PAGES: "true"
          # Required: repository secret APP_PASSWORD (Settings → Secrets → Actions).
          NEXT_PUBLIC_APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
